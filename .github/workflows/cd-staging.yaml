name: CD Staging (Build, Push & Deploy)

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy-staging:
    name: Deploy to Staging EKS
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.16.2'

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Microservice Images
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          SERVICES=("api-gateway" "customers-service" "vets-service" "visits-service")
          for SERVICE in "${SERVICES[@]}"; do
            REPO_NAME="carelink-staging-${SERVICE}"
            echo "Building ${SERVICE}..."
            docker build \
              -t ${REGISTRY}/${REPO_NAME}:${IMAGE_TAG} \
              -t ${REGISTRY}/${REPO_NAME}:latest \
              -f services/${SERVICE}/Dockerfile .
            
            echo "Pushing ${SERVICE} to ${REPO_NAME}..."
            docker push ${REGISTRY}/${REPO_NAME}:${IMAGE_TAG}
            docker push ${REGISTRY}/${REPO_NAME}:latest
          done

      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ vars.AWS_REGION }} --name carelink-staging-eks

      - name: Ensure Staging Namespace Exists
        run: |
          kubectl get namespace staging || kubectl create namespace staging

      - name: Deploy to Staging via Helm
        run: |
          helm upgrade --install carelink-app ./helm/carelink-app \
            --namespace staging \
            --values ./helm/carelink-app/values.yaml \
            --values ./helm/carelink-app/values-staging.yaml \
            --set image.tag=${{ github.sha }} \
            --wait \
            --timeout 5m
